image:
  repository: registry.internal.rojandinc.se/rojandincse
  tag: latest
ingress:
  enabled: true
  className: traefik
  annotations:
    external-dns.kubernetes.io/hostname: "www.rojandinc.se"
    external-dns.kubernetes.io/target: tunnel.rojandinc.se
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: www.rojandinc.se
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: rojandinc.se
      paths:
        - path: /
          pathType: ImplementationSpecific
env:
  - name: PORT
    value: "80"
service:
  port: 80
resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 10m
    memory: 20Mi
autoscaling:
  enabled: false
livenessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 3
  periodSeconds: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: 80
  initialDelaySeconds: 3
  periodSeconds: 3
